[package]
name = "weekend-raytracer-wgpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "wayland", "x11"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
hw-skymodel = "0.1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
nalgebra-glm = { version = "0.21.0", features = ["convert-bytemuck"] }
pollster = "1.0.1"
thiserror = "2.0.21"
wgpu = "30.0.2"
winit = "0.30.13"
gltf = { version = "1.4.1", features = ["KHR_materials_emissive_strength", "KHR_materials_ior", "KHR_materials_specular", "KHR_materials_transmission", "KHR_materials_volume", "KHR_texture_transform", "extensions"] }

half = "2.7.1"
texpresso = "2.0.2"
gilrs = "0.11"
